
name: Build ShizukuRunner APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Extract source ZIP
        run: |
          mkdir extracted
          unzip -q "ShizukuRunner-可构建源码.zip" -d extracted

      - name: Build APK
        working-directory: extracted/ShizukuRunner-build/ShizukuRunner-main
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShizukuRunner-debug-apk
          path: extracted/ShizukuRunner-build/ShizukuRunner-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
